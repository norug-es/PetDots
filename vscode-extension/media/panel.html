<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><style>
:root{color-scheme:dark;font:12px system-ui;background:#111827;color:#e5e7eb}body{margin:0;padding:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{background:#1f2937;border:1px solid #374151;border-radius:10px;padding:8px;min-height:78px}.pet{height:42px;position:relative;display:flex;align-items:center;gap:7px}.creature{width:30px;height:26px;border-radius:48% 52% 45% 55%;background:var(--hue);position:relative;box-shadow:8px -5px 0 color-mix(in srgb,var(--hue),white 20%);animation:float 2.4s ease-in-out infinite}.creature:before,.creature:after{content:'';position:absolute;width:7px;height:7px;background:#111827;border-radius:50%;top:8px}.creature:before{left:7px}.creature:after{right:7px}.architect .creature{border-radius:50% 35% 60% 40%}.backend .creature{box-shadow:8px -5px 0 #6ee7b7,-7px 5px 0 #10b981}.frontend .creature{border-radius:55% 45% 20% 80%;transform:scaleX(1.18)}.security .creature{border:2px solid #fde68a}.qa .creature{border-radius:30% 70% 40% 60%}.release .creature{box-shadow:8px -5px 0 #f9a8d4,0 5px 0 #be185d}.working .creature{animation:work .65s ease-in-out infinite}.blocked .creature{filter:grayscale(.7);animation:shake .25s linear infinite}.done .creature{animation:pop 1.2s ease-in-out infinite}.name{font-weight:700}.meta{color:#9ca3af;font-size:11px}.message{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sim{color:#fbbf24}.badge{float:right;font-size:10px;padding:2px 5px;border-radius:5px;background:#374151}@keyframes float{50%{transform:translateY(-3px) rotate(3deg)}}@keyframes work{50%{transform:translate(3px,-2px) rotate(-8deg)}}@keyframes shake{50%{transform:translateX(2px)}}@keyframes pop{50%{transform:scale(1.15) rotate(8deg)}}
</style></head><body><h3>PetDots <small>agent habitat</small></h3><div id="grid" class="grid"></div><p id="empty" class="meta">Esperando eventos reales de agentes...</p><script>
const names={architect:['Architect','#a78bfa'],backend:['Backend','#34d399'],frontend:['Frontend','#60a5fa'],security:['Security','#fbbf24'],qa:['QA','#fb7185'],release:['Release','#f472b6']};const states=['idle','working','blocked','reviewing','done'];let events=[];function render(){const latest={};events.forEach(e=>{if(names[e.agent]&&states.includes(e.state))latest[e.agent]=e});grid.innerHTML=Object.keys(names).map(k=>{const e=latest[k]||{state:'idle',message:'Awaiting an event',source:'',simulated:false};return '<article class="card '+k+' '+e.state+'"><span class="badge">'+e.state+'</span><div class="pet"><i class="creature" style="--hue:'+names[k][1]+'"></i><span class="name">'+names[k][0]+'</span></div><div class="message">'+(e.message||'')+'</div><div class="meta '+(e.simulated?'sim':'')+'">'+(e.simulated?'SIMULATED · ':'')+(e.source||'no source')+'</div></article>'}).join('');empty.style.display=events.length?'none':'block'}window.addEventListener('message',m=>{try{events=m.data.text.split(/\r?\n/).filter(Boolean).map(JSON.parse);render()}catch(_){}});render();
</script></body></html>
