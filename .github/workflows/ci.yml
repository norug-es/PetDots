name: PetDots CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: node --input-type=module -e "import fs from 'node:fs'; for (const file of ['plugin/plugin.json','plugin/mcp.json','schemas/agent-event.schema.json']) JSON.parse(fs.readFileSync(file,'utf8')); console.log('manifests pass')"
